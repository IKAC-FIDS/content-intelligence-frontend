services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        NPM_CONFIG_REGISTRY: "${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}"
    container_name: content-intelligence-frontend
    restart: unless-stopped
    ports:
      - "${CONTENT_INTELLIGENCE_FRONTEND_PORT:-8082}:80"
    networks:
      - shared-services

networks:
  shared-services:
    external: true
    name: "${SHARED_DOCKER_NETWORK:-iam-crm-backend_default}"
